# Mosquitto broker for the AMS digital-twin demo.
# Run:  mosquitto -c algorithm/mosquitto.conf
#
# Two listeners on localhost:
#   1883  plain TCP        — the streamer (paho) publishes here
#   9001  WebSockets       — the browser dashboard (mqtt.js) subscribes here
# Local demo only, so anonymous access is allowed. Do not expose these ports.

# Bind explicitly to 127.0.0.1: on macOS "localhost" can resolve to IPv6 ::1
# only, which leaves the browser's IPv4 ws://127.0.0.1:9001 connection refused.
listener 1883 127.0.0.1
protocol mqtt

listener 9001 127.0.0.1
protocol websockets

allow_anonymous true
