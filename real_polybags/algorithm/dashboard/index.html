<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera System Digital Twin</title>
<style>
  :root { --bg:#0d0f13; --panel:#161a21; --line:#262c36; --ink:#e7edf3; --sub:#9aa7b4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  header .title { font-weight:600; }
  header .sub { color:var(--sub); font-size:12px; }
  #status { margin-left:auto; font:600 11px/1 monospace; padding:4px 8px;
    border-radius:6px; background:#20262f; color:var(--sub); }
  #status.on { color:#5ee08a; } #status.off { color:#ff6b6b; }
  #stage { position:relative; flex:1; overflow:hidden; }
  #map { position:absolute; inset:0; width:100%; height:100%; display:block;
    cursor:grab; }
  #map:active { cursor:grabbing; }
  #legend { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.55);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; }
  #legend .row { display:flex; align-items:center; gap:7px; margin:3px 0; }
  #legend .dot { width:11px; height:11px; border-radius:50%; }
  #legend .hint { color:var(--sub); margin-top:6px; font-size:11px; max-width:200px; }
  #count { position:absolute; right:10px; top:10px; background:rgba(0,0,0,.55);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px;
    font:600 12px/1.3 monospace; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <div class="title">Camera System Digital Twin</div>
      <div class="sub" id="hdr-sub">conveyor · live polybag positions</div>
    </div>
    <div id="status" class="off">MQTT ◦ connecting</div>
  </header>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="count">0 polybags</div>
    <div id="legend"></div>
  </div>
</div>
<script src="vendor/mqtt.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
